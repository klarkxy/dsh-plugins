name: Publish npm plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'klarkxy/dsh-plugins' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip superseded source
        id: source
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.source.outputs.current == 'true'
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        if: steps.source.outputs.current == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - if: steps.source.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.source.outputs.current == 'true'
        run: pnpm build
      - name: Compare package contents and select versions
        if: steps.source.outputs.current == 'true'
        run: node scripts/publish-npm.mjs plan
      - if: steps.source.outputs.current == 'true'
        run: pnpm check
      - name: Publish changed packages and verify archives
        if: steps.source.outputs.current == 'true'
        run: node scripts/publish-npm.mjs publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Write package versions back to main
        if: steps.source.outputs.current == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/publish-npm.mjs commit
      - name: Preserve plan and release archives
        if: always() && steps.source.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/npm-release/
          if-no-files-found: ignore
