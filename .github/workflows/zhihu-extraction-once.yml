name: Zhihu extraction validation
on:
  push:
    branches: [refactor/extract-editor-public-plugins]
    paths: [.github/workflows/zhihu-extraction-once.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: work
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: klarkxy/dsh-editor
          ref: 36eadb6fbae398a12dc21e7b2200dd06e2bf3f7b
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply pinned extraction
        working-directory: work
        run: python3 scripts/migrate-zhihu-once.py plugins . ../source
      - name: Refresh and freeze lockfile
        working-directory: work
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
      - name: Validate all packages, boundaries, tests and archives
        working-directory: work
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee /tmp/zhihu-plugins-check.log
      - name: Commit only reviewed migration scope
        working-directory: work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/dsh-zhihu README.md README.zh-CN.md docs/editor-plugin-migration.md scripts/editor-plugin-migration.json scripts/editor-plugins/client-style-ownership.spec.mjs site/catalog.json pnpm-lock.yaml
          git diff --cached --stat
          git commit -m 'refactor: include Zhihu as tenth portable plugin without private UI dependency'
          git push origin HEAD:refactor/extract-editor-public-plugins
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zhihu-plugins-validation
          path: /tmp/zhihu-plugins-check.log
          retention-days: 3
          if-no-files-found: ignore
