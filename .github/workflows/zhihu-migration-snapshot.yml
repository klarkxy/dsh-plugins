name: Zhihu migration snapshot
on:
  push:
    branches: [refactor/extract-editor-public-plugins]
    paths: [.github/workflows/zhihu-migration-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugins
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: klarkxy/dsh-editor
          ref: 36eadb6fbae398a12dc21e7b2200dd06e2bf3f7b
          path: editor
          persist-credentials: false
      - name: Archive pinned source trees
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/zhihu-source-snapshot.tgz plugins editor
      - uses: actions/upload-artifact@v4
        with:
          name: zhihu-source-snapshot
          path: /tmp/zhihu-source-snapshot.tgz
          retention-days: 1
