name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the pinned DeepSeek Harness commit
        run: node plugins/dsh-dev-index/scripts/fetch-pinned.mjs /tmp/deepseek-harness
      - name: Verify citations against that commit
        run: node plugins/dsh-dev-index/scripts/verify-citations.mjs /tmp/deepseek-harness
      - run: pnpm check
        env:
          DSH_CHECKOUT: /tmp/deepseek-harness
          DSH_REQUIRE_CHECKOUT: "1"
